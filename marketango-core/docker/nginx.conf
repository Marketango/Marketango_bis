# Marketango Core — Nginx Reverse Proxy Configuration
# Copy to: /etc/nginx/sites-available/marketango-core
# Enable with: ln -s /etc/nginx/sites-available/marketango-core /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.marketango.co auth.marketango.co;
    return 301 https://$host$request_uri;
}

# api.marketango.co — Core API (all endpoints)
server {
    listen 443 ssl http2;
    server_name api.marketango.co;

    ssl_certificate /etc/letsencrypt/live/api.marketango.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.marketango.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# auth.marketango.co — Auth endpoints only (same backend, different subdomain)
server {
    listen 443 ssl http2;
    server_name auth.marketango.co;

    ssl_certificate /etc/letsencrypt/live/auth.marketango.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.marketango.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Only expose auth routes through auth subdomain
    location /api/v1/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
