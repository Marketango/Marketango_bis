<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketango Writer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 12px; padding: 40px; width: 100%; max-width: 380px;
    }
    .logo { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .logo span { color: #6366f1; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 32px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #999; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; background: #252525;
      border: 1px solid #333; border-radius: 8px; color: #fff;
      font-size: 14px; outline: none; transition: border 0.2s;
    }
    input:focus { border-color: #6366f1; }
    button[type=submit] {
      width: 100%; padding: 12px; background: #6366f1; border: none;
      border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: background 0.2s;
    }
    button[type=submit]:hover { background: #4f52d3; }
    button[type=submit]:disabled { background: #333; color: #666; cursor: not-allowed; }
    .error {
      background: #2d1a1a; border: 1px solid #5a1a1a; color: #ff6b6b;
      padding: 10px 14px; border-radius: 8px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }

    /* App shell */
    #app { display: none; width: 100%; }
    body.app-mode { align-items: flex-start; }
    body.app-mode .card { display: none; }
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
      position: sticky; top: 0;
    }
    .app-content { padding: 40px 28px; }
    .user-badge {
      background: #252525; border: 1px solid #333; border-radius: 20px;
      padding: 6px 14px; font-size: 13px; color: #999;
    }
    .user-badge span { color: #6366f1; }
    .logout-btn {
      background: none; border: 1px solid #333; color: #666;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      font-size: 13px; transition: all 0.2s;
    }
    .logout-btn:hover { border-color: #666; color: #fff; }
    .welcome { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .welcome-sub { color: #666; font-size: 14px; margin-bottom: 24px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1a2a1a; border: 1px solid #2a4a2a;
      color: #6bcf6b; padding: 8px 16px; border-radius: 20px; font-size: 13px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #6bcf6b;
      animation: pulse 2s infinite;
    }
    .role-badge {
      display: inline-block; background: #1e1a2e; border: 1px solid #3a2a6a;
      color: #a78bfa; padding: 3px 10px; border-radius: 12px;
      font-size: 12px; margin-left: 8px; vertical-align: middle;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>

  <!-- Login card -->
  <div class="card" id="login-card">
    <div class="logo">Marketango <span>Writer</span></div>
    <div class="subtitle">Accede con tu cuenta de agencia</div>
    <div class="error" id="error-msg"></div>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="tu@email.com" required autofocus>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="submit-btn">Entrar</button>
    </form>
  </div>

  <!-- App shell -->
  <div id="app">
    <div class="app-header">
      <div class="logo">Marketango <span>Writer</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="user-badge">
          <span id="header-email"></span>
          <span class="role-badge" id="header-role"></span>
        </div>
        <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
      </div>
    </div>
    <div class="app-content">
      <div class="welcome">¡Hola, <span id="app-name"></span>!</div>
      <div class="welcome-sub">Sesión activa · validada por <strong>auth.marketango.co</strong></div>
      <div class="badge">
        <span class="dot"></span>
        writer.marketango.co · en línea
      </div>
    </div>
  </div>

  <script>
    const AUTH = 'https://auth.marketango.co';

    function token()  { return localStorage.getItem('mkt_token'); }
    function user()   { return JSON.parse(localStorage.getItem('mkt_user') || 'null'); }

    function showApp(u) {
      document.body.classList.add('app-mode');
      document.getElementById('app').style.display = 'block';
      document.getElementById('header-email').textContent = u.email;
      document.getElementById('header-role').textContent  = u.role;
      document.getElementById('app-name').textContent     = u.email.split('@')[0];
    }

    function logout() {
      localStorage.removeItem('mkt_token');
      localStorage.removeItem('mkt_refresh');
      localStorage.removeItem('mkt_user');
      document.body.classList.remove('app-mode');
      document.getElementById('app').style.display = 'none';
    }

    // Restore session
    if (token() && user()) showApp(user());

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-msg');
      btn.disabled    = true;
      btn.textContent = 'Verificando...';
      err.style.display = 'none';

      try {
        const res  = await fetch(`${AUTH}/api/v1/auth/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            email:    document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('mkt_token',   data.data.accessToken);
          localStorage.setItem('mkt_refresh',  data.data.refreshToken);
          localStorage.setItem('mkt_user',     JSON.stringify(data.data.user));
          showApp(data.data.user);
        } else {
          err.textContent   = data.message || 'Credenciales incorrectas';
          err.style.display = 'block';
        }
      } catch {
        err.textContent   = 'No se pudo conectar con auth.marketango.co';
        err.style.display = 'block';
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
