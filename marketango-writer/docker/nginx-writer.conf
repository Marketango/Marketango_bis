# ── writer.marketango.co ─────────────────────────────────────
server {
    listen 80;
    server_name writer.marketango.co;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name writer.marketango.co;
    ssl_certificate     /etc/letsencrypt/live/writer.marketango.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writer.marketango.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $writer http://marketango-writer:4000;
        proxy_pass $writer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
