name: Marketango Writer — CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'marketango-writer/**'

defaults:
  run:
    working-directory: marketango-writer

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketango-writer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CORE_API_URL: http://localhost:3000
          NODE_ENV: test

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}
            git pull origin main
            cd marketango-writer
            docker compose up -d --build
            echo "Writer deploy completed: $(date)"
